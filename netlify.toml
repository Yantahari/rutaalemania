[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SIN REDIRECCIONES, Y ES DELIBERADO (2026-08-01, día 144).
# Aquí vivían /calculadora → /#calculadora y /simulador → /#simulador, puestas
# el 22-feb-2026 con el despliegue inicial. Se retiran porque quedaron SIN UN
# SOLO CONSUMIDOR en todo el proyecto, medido: el sitio siempre usó las anclas
# directas, y el único uso externo era la descripción del vídeo [2] del canal,
# que el mismo día pasó a apuntar a /#simulador y /#calculadora.
# /calculadora llevaba cinco meses sin que la usara nadie.
# La única objeción era la cola invisible de enlaces compartidos fuera; el
# Director confirma que NUNCA compartió esas URL fuera del canal.
# NO ES UN DESCUIDO: es retirar configuración que ya no sostenía nada.

# La redirección de abajo NO revierte lo anterior (9-ago-2026, día 156, orden
# del Director): /sitemap.xml devolvía 404 con consumidor real (crawlers); el
# sitemap verdadero de Astro es /sitemap-index.xml. Las de /calculadora y
# /simulador NO vuelven.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
