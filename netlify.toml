[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SIN REDIRECCIONES, Y ES DELIBERADO (2026-08-01, día 144).
# Aquí vivían /calculadora → /#calculadora y /simulador → /#simulador, puestas
# el 22-feb-2026 con el despliegue inicial. Se retiran porque quedaron SIN UN
# SOLO CONSUMIDOR en todo el proyecto, medido: el sitio siempre usó las anclas
# directas, y el único uso externo era la descripción del vídeo [2] del canal,
# que el mismo día pasó a apuntar a /#simulador y /#calculadora.
# /calculadora llevaba cinco meses sin que la usara nadie.
# La única objeción era la cola invisible de enlaces compartidos fuera; el
# Director confirma que NUNCA compartió esas URL fuera del canal.
# NO ES UN DESCUIDO: es retirar configuración que ya no sostenía nada.

# La redirección de abajo NO revierte lo anterior (9-ago-2026, día 156, orden
# del Director): /sitemap.xml devolvía 404 con consumidor real (crawlers); el
# sitemap verdadero de Astro es /sitemap-index.xml. Las de /calculadora y
# /simulador NO vuelven.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# ⚠️ LA BARRA FINAL LA DECIDE NETLIFY, Y NO ESTÁ AQUÍ (medido el 14-ago-2026,
# día 166). Producción, comprobada con curl contra URLs reales:
#     /blog/trabajar-alemania-sin-aleman   301 → /blog/trabajar-alemania-sin-aleman/
#     /blog/trabajar-alemania-sin-aleman/  200
#     /links                               301 → /links/
# Eso es el comportamiento POR DEFECTO de Netlify: no hay ni una regla de barra
# final en este fichero, así que NADIE LO HA DECIDIDO Y NADIE LO VIGILA. Si un
# día Netlify lo cambia, cambia sin aviso y se lleva por delante el argumento
# entero de `trailingSlash: 'always'` en astro.config.mjs — que se puso porque
# COINCIDE con esto, no porque lo imponga (las páginas son prerenderizadas y
# Astro no gobierna su forma en producción).
#
# POR QUÉ NO SE FIJA AQUÍ, y es decisión declarada y no olvido: Netlify tuvo una
# clave `[build.processing.html] pretty_urls`, la sección existe y está VACÍA en
# la config resuelta (.netlify/netlify.toml), y CCode NO PUDO VERIFICAR EN DISCO
# que siga admitiéndose. Escribir una clave que quizá ya no se lee sería
# exactamente el fallo silencioso del §8.53: configuración ignorada sin avisar,
# con la falsa sensación de estar cubierto. Se anota el hecho medido en vez de
# inventar la regla. Si alguien confirma la clave, se fija aquí y se borra esto.

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
